<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3d644e"><title>登录 · 投递手记</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css"><script src="/assets/login.js" type="module"></script>
</head>
<body class="login-body">
  <main class="login-layout">
    <section class="login-story">
      <a class="brand" href="/"><span class="brand-mark">↗</span><span>投递手记<small>APPLICATION JOURNAL</small></span></a>
      <div class="login-story-copy"><span class="eyebrow">属于你的求职空间</span><h1>认真走过的每一步，<br>都值得被记住。</h1><p>从第一份收藏，到心仪的 Offer。<br>把进展和安排放在一起，让秋招更从容。</p></div>
      <div class="journey-illustration" aria-hidden="true"><div class="journey-line"></div><span class="journey-node node-one">01<small>投递</small></span><span class="journey-node node-two">02<small>面试</small></span><span class="journey-node node-three">↗<small>新的开始</small></span></div>
      <p class="login-footnote">一点点推进，离理想的工作更近一点。</p>
    </section>
    <section class="login-form-section"><form id="login-form" class="login-form">
      <span class="eyebrow">WELCOME BACK</span><h2>欢迎回来</h2><p class="muted">输入个人密码，继续你的求职旅程。</p>
      <label for="password">访问密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus placeholder="请输入你的密码">
      <p id="login-error" class="form-error" role="alert"></p>
      <button type="submit" class="button primary full-width">进入我的手记 <span aria-hidden="true">↗</span></button>
      <p class="login-private">个人专属空间 · 无需注册</p>
    </form></section>
  </main>
</body>
</html>
